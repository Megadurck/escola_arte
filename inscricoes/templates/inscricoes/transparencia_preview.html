{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ documento.titulo }} - Visualização</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --azul: #0f406d;
            --amarelo: #f7b500;
            --cinza: #eef2f7;
            --texto: #1f2d3d;
            --branco: #ffffff;
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #f8f9fb 0%, #eef3f7 100%);
            color: var(--texto);
            font-family: 'Montserrat', sans-serif;
        }

        .preview-shell {
            max-width: 1200px;
            margin: 28px auto;
            padding: 0 18px 36px;
        }

        .preview-header {
            background: var(--branco);
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(15, 64, 109, 0.08);
            padding: 20px 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .preview-header h1 {
            margin: 0;
            font-size: clamp(1.5rem, 2.2vw, 2.2rem);
            color: var(--azul);
            font-family: 'Merriweather', Georgia, serif;
        }

        .preview-header .badge {
            background: #eaf7ef;
            color: #0d7b46;
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.72rem;
        }

        .preview-frame {
            background: var(--branco);
            border-radius: 20px;
            box-shadow: 0 14px 28px rgba(15, 64, 109, 0.10);
            padding: 14px;
            min-height: 72vh;
        }

        .preview-frame iframe {
            width: 100%;
            min-height: 72vh;
            border: 0;
            border-radius: 12px;
            background: var(--cinza);
        }

        .preview-note {
            margin-top: 18px;
            color: var(--texto);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            background: var(--azul);
            color: #fff;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.2s ease;
        }

        .btn-voltar:hover {
            opacity: 0.92;
            color: #fff;
        }

        @media (max-width: 767px) {
            .preview-shell {
                padding: 0 12px 28px;
            }

            .preview-header {
                padding: 16px 18px;
            }

            .preview-frame {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="preview-shell">
        <div class="preview-header">
            <div>
                <h1>{{ documento.titulo }}</h1>
            </div>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="badge">{{ documento.get_categoria_display }}</span>
                <a class="btn-voltar" href="{% url 'inscricoes:transparencia' %}">Voltar</a>
            </div>
        </div>

        <div class="preview-frame">
            <iframe
                src="{{ arquivo_url }}"
                title="Visualização de {{ documento.titulo }}"
                loading="lazy"
                sandbox="allow-scripts allow-same-origin allow-forms"
            ></iframe>
        </div>

        {% if documento.descricao %}
            <div class="preview-note">
                {{ documento.descricao }}
            </div>
        {% endif %}
    </div>
</body>
</html>
